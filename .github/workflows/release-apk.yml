name: Release APK

on:
  push:
    tags:
      - 'wamda-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. wamda-v1.0.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: |
          if [ -f l10n.yaml ] || [ -d lib/l10n ]; then
            flutter gen-l10n || true
          fi

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build APK (Release arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare APK Asset & Metadata
        id: prepare_asset
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d "\"'" | cut -d'+' -f1)
          BUILD=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d "\"'" | cut -d'+' -f2)
          FULL_VERSION="${VERSION}+${BUILD}"
          APK_NAME="wamda-v${VERSION}-arm64-v8a.apk"
          
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TARGET_TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
          else
            TARGET_TAG="wamda-v${VERSION}"
          fi
          
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_asset.outputs.target_tag }}
          name: Wamda ${{ steps.prepare_asset.outputs.version }} (arm64-v8a)
          files: ${{ steps.prepare_asset.outputs.apk_name }}
          draft: false
          prerelease: false
          body: |
            ## Android APK (arm64-v8a)

            | الحقل | القيمة |
            |---|---|
            | الملف | `${{ steps.prepare_asset.outputs.apk_name }}` |
            | المعمارية | `arm64-v8a` (ARMv8 / 64-bit) |
            | الإصدار | `${{ steps.prepare_asset.outputs.full_version }}` |
            | SHA-256 | `${{ steps.prepare_asset.outputs.sha256 }}` |

            ### الميزات والتحديثات
            - ميزة **ومضات** الجديدة كلياً: مقاطع ريلز وشورتس إسلامية وقرانية وتوعوية بدقة 720p HD بدون استهلاك إنترنت (تعمل أوفلاين بالكامل).
            - توقيع رسمي بمفتاح `release.keystore` مع نفس معرف التطبيق `ye.coretech.wamda`، لإمكانية التحديث المباشر فوق النسخ السابقة.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
